<!DOCTYPE html>
<html lang="fr" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Cahier Numérique - Ultimate Edition</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400..700&family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif'],
                        hand: ['Caveat', 'cursive'],
                        arabic: ['Amiri', 'serif'],
                    },
                    colors: {
                        primary: '#2563eb',
                        secondary: '#f3f4f6',
                        paper: '#fdfbf7',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <style>
        .paper-seyes {
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(90deg, rgba(200, 200, 255, 0.5) 1px, transparent 1px),
                linear-gradient(rgba(200, 200, 255, 0.8) 1px, transparent 1px),
                linear-gradient(rgba(200, 200, 255, 0.3) 1px, transparent 1px);
            background-size: 2rem 100%, 100% 2rem, 100% 0.5rem;
            position: relative;
        }
        .paper-seyes::before {
            content: '';
            position: absolute;
            left: 3rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ef4444;
            z-index: 5;
        }
        .paper-grid {
            background-color: #fdfbf7;
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .paper-lines {
            background-color: #fdfbf7;
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 100% 2rem;
        }
        .paper-dots {
            background-color: #fdfbf7;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @media (max-width: 640px) {
            .paper-seyes { background-size: 1.5rem 100%, 100% 1.5rem, 100% 0.375rem; }
            .paper-seyes::before { left: 2rem; }
        }
    </style>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body class="bg-neutral-100 text-neutral-900 h-screen overflow-hidden selection:bg-blue-100 touch-manipulation flex flex-col font-sans">
    <div id="root" class="flex-1 h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- ERROR BOUNDARY ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) { console.error(error, errorInfo); }
            render() {
                if (this.state.hasError) return <div className="p-4 text-center text-red-500">Une erreur est survenue. <button onClick={()=>window.location.reload()} className="underline">Recharger</button></div>;
                return this.props.children;
            }
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const Button = ({ children, onClick, className = "", variant = "primary", size = "md", disabled = false, title = "", active = false }) => {
            const baseStyle = "inline-flex items-center justify-center rounded-lg font-medium transition-all duration-200 focus:outline-none disabled:opacity-50 disabled:pointer-events-none active:scale-95 select-none";
            const variants = {
                primary: "bg-blue-600 text-white hover:bg-blue-700 shadow-sm hover:shadow-md",
                outline: `border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 ${active ? 'ring-2 ring-blue-500 border-blue-500 bg-blue-50 text-blue-700' : ''}`,
                ghost: `hover:bg-gray-100 text-gray-600 ${active ? 'bg-gray-100 text-gray-900 font-bold' : ''}`,
                icon: "p-0 rounded-full hover:bg-black/5"
            };
            const sizes = { sm: "h-8 px-3 text-xs", md: "h-10 px-4 py-2", lg: "h-12 px-8 text-lg", icon: "h-10 w-10" };
            return (
                <button onClick={onClick} disabled={disabled} title={title} className={`${baseStyle} ${variants[variant] || variants.primary} ${sizes[size] || sizes.md} ${className}`}>
                    {children}
                </button>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-slide-up flex flex-col max-h-[90vh]">
                        <div className="flex justify-between items-center p-5 border-b bg-gray-50/50">
                            <h3 className="text-xl font-bold text-gray-800">{title}</h3>
                            <Button variant="ghost" size="icon" onClick={onClose}><Icon name="x" size={18} /></Button>
                        </div>
                        <div className="p-6 overflow-y-auto">{children}</div>
                    </div>
                </div>
            );
        };

        const NotebookCanvas = ({ color = "#1e3a8a", brushSize = 2, paperType = "seyes" }) => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [ctx, setCtx] = useState(null);

            useEffect(() => {
                const init = () => {
                    const canvas = canvasRef.current;
                    const container = containerRef.current;
                    if (!canvas || !container) return;
                    const dpr = window.devicePixelRatio || 1;
                    const rect = container.getBoundingClientRect();
                    canvas.width = rect.width * dpr;
                    canvas.height = rect.height * dpr;
                    const context = canvas.getContext('2d');
                    context.scale(dpr, dpr);
                    context.lineCap = 'round';
                    context.lineJoin = 'round';
                    context.strokeStyle = color;
                    context.lineWidth = brushSize;
                    setCtx(context);
                };
                init();
                window.addEventListener('resize', init);
                return () => window.removeEventListener('resize', init);
            }, []);

            useEffect(() => {
                if (ctx) { ctx.strokeStyle = color; ctx.lineWidth = brushSize; }
            }, [color, brushSize, ctx]);

            const getPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const start = (e) => { setIsDrawing(true); const { x, y } = getPos(e); ctx.beginPath(); ctx.moveTo(x, y); };
            const move = (e) => { if (!isDrawing) return; const { x, y } = getPos(e); ctx.lineTo(x, y); ctx.stroke(); };
            const stop = () => { setIsDrawing(false); if(ctx) ctx.closePath(); };
            const clear = () => { if(ctx && canvasRef.current) ctx.clearRect(0,0, canvasRef.current.width, canvasRef.current.height); };
            const download = async () => {
                if (!containerRef.current) return;
                const canvas = await html2canvas(containerRef.current);
                const link = document.createElement('a');
                link.download = `page-${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            };

            return (
                <div ref={containerRef} className={`w-full h-full relative group shadow-2xl rounded-sm overflow-hidden ${paperType === 'seyes' ? 'paper-seyes' : paperType === 'grid' ? 'paper-grid' : paperType === 'lines' ? 'paper-lines' : 'paper-dots'}`}>
                     <div className="absolute top-4 right-4 z-20 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <Button variant="outline" size="icon" onClick={download} title="Sauvegarder" className="bg-white/90 shadow"><Icon name="download" size={16} /></Button>
                        <Button variant="outline" size="icon" onClick={clear} title="Effacer" className="bg-white/90 shadow text-red-500 hover:text-red-600"><Icon name="trash-2" size={16} /></Button>
                    </div>
                    <canvas ref={canvasRef} className="w-full h-full cursor-crosshair touch-none absolute inset-0 z-10"
                        onMouseDown={start} onMouseMove={move} onMouseUp={stop} onMouseLeave={stop}
                        onTouchStart={start} onTouchMove={move} onTouchEnd={stop} />
                </div>
            );
        };

        // --- QURAN PLAYER (DIRECT MP3 - NO API CALLS FOR AUDIO) ---
        const QuranPlayer = () => {
            // Static list of reliable MP3Quran servers
            const RECITERS = [
                { id: "yasser", name: "Yasser Al-Dosari", server: "https://server11.mp3quran.net/yasser" },
                { id: "afs", name: "Mishary Rashid Alafasy", server: "https://server8.mp3quran.net/afs" },
                { id: "shatri", name: "Abu Bakr Al-Shatri", server: "https://server11.mp3quran.net/shatri" },
                { id: "sudais", name: "Abdul Rahman Al-Sudais", server: "https://server11.mp3quran.net/sds" },
                { id: "maher", name: "Maher Al-Muaiqly", server: "https://server12.mp3quran.net/maher" },
                { id: "ajm", name: "Ahmed Al-Ajmy", server: "https://server10.mp3quran.net/ajm" }
            ];

            // Generate Surah list locally (no API call needed for list)
            // This guarantees no "white page" from API failure
            const SURAHS = Array.from({length: 114}, (_, i) => {
                const id = i + 1;
                return { id: id, name: `Sourate ${id}`, value: String(id).padStart(3, '0') };
            });

            const [selectedReciter, setSelectedReciter] = useState(RECITERS[0]); // Default Yasser
            const [selectedSurah, setSelectedSurah] = useState(SURAHS[0]); // Default Al-Fatihah
            const [isPlaying, setIsPlaying] = useState(false);
            const [loading, setLoading] = useState(false);
            const audioRef = useRef(null);

            const play = () => {
                if(!audioRef.current) return;
                const url = `${selectedReciter.server}/${selectedSurah.value}.mp3`;
                
                // Only change src if it's different to avoid reload
                if (!audioRef.current.src.includes(url)) {
                    setLoading(true);
                    audioRef.current.src = url;
                }
                
                audioRef.current.play()
                    .then(() => { setIsPlaying(true); setLoading(false); })
                    .catch(e => { console.error(e); setIsPlaying(false); setLoading(false); });
            };

            const pause = () => {
                if(audioRef.current) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                }
            };

            const toggle = () => isPlaying ? pause() : play();

            const nextSurah = () => {
                const idx = SURAHS.findIndex(s => s.id === selectedSurah.id);
                if (idx < SURAHS.length - 1) setSelectedSurah(SURAHS[idx + 1]);
            };

            const prevSurah = () => {
                const idx = SURAHS.findIndex(s => s.id === selectedSurah.id);
                if (idx > 0) setSelectedSurah(SURAHS[idx - 1]);
            };

            // Auto-play when selection changes if was already playing
            useEffect(() => {
                if(isPlaying) play(); 
                else {
                    // Preload only
                    if(audioRef.current) audioRef.current.src = `${selectedReciter.server}/${selectedSurah.value}.mp3`;
                }
            }, [selectedReciter, selectedSurah]);

            return (
                <div className="h-full flex flex-col items-center justify-center p-4 lg:p-10 w-full">
                    <audio ref={audioRef} onEnded={() => setIsPlaying(false)} onError={() => {setLoading(false); setIsPlaying(false); alert("Erreur de lecture audio");}} />
                    
                    <div className="bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/60 p-8 md:p-12 w-full max-w-4xl flex flex-col gap-8 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600"></div>
                        
                        <div className="text-center space-y-2 z-10">
                            <h2 className="text-4xl font-arabic text-gray-800 drop-shadow-sm">القرآن الكريم</h2>
                            <p className="text-gray-500 font-medium tracking-wide">ÉCOUTEZ ET MÉDITEZ</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 z-10">
                            <div className="space-y-3">
                                <label className="text-xs font-bold text-gray-400 uppercase tracking-wider">Récitateur</label>
                                <div className="relative group">
                                    <select 
                                        className="w-full appearance-none bg-gray-50 border border-gray-200 text-gray-700 py-4 px-5 pr-10 rounded-xl font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer hover:bg-white hover:shadow-sm"
                                        value={selectedReciter.id}
                                        onChange={e => setSelectedReciter(RECITERS.find(r => r.id === e.target.value))}
                                    >
                                        {RECITERS.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                    </select>
                                    <div className="absolute inset-y-0 right-4 flex items-center pointer-events-none text-gray-400 group-hover:text-blue-500 transition-colors">
                                        <Icon name="chevron-down" size={20} />
                                    </div>
                                </div>
                            </div>
                            
                            <div className="space-y-3">
                                <label className="text-xs font-bold text-gray-400 uppercase tracking-wider">Sourate</label>
                                <div className="relative group">
                                    <select 
                                        className="w-full appearance-none bg-gray-50 border border-gray-200 text-gray-700 py-4 px-5 pr-10 rounded-xl font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer hover:bg-white hover:shadow-sm"
                                        value={selectedSurah.id}
                                        onChange={e => setSelectedSurah(SURAHS.find(s => s.id == e.target.value))}
                                    >
                                        {SURAHS.map(s => <option key={s.id} value={s.id}>{s.id}. {s.name}</option>)}
                                    </select>
                                    <div className="absolute inset-y-0 right-4 flex items-center pointer-events-none text-gray-400 group-hover:text-blue-500 transition-colors">
                                        <Icon name="chevron-down" size={20} />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center justify-center gap-8 py-6 z-10">
                            <button onClick={prevSurah} className="p-4 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-all active:scale-95"><Icon name="skip-back" size={32} /></button>
                            
                            <button 
                                onClick={toggle}
                                className={`h-24 w-24 rounded-full flex items-center justify-center shadow-xl hover:shadow-2xl hover:shadow-blue-500/30 hover:-translate-y-1 transition-all active:scale-95 active:translate-y-0 ${loading ? 'bg-gray-100 cursor-wait' : 'bg-gradient-to-br from-blue-600 to-indigo-600 text-white'}`}
                            >
                                {loading ? <span className="animate-spin text-gray-400"><Icon name="loader-2" size={32} /></span> : 
                                 isPlaying ? <Icon name="pause" size={40} className="fill-current" /> : <Icon name="play" size={40} className="ml-2 fill-current" />}
                            </button>

                            <button onClick={nextSurah} className="p-4 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-all active:scale-95"><Icon name="skip-forward" size={32} /></button>
                        </div>

                        <div className="text-center pt-4 border-t border-gray-100">
                             <h3 className="text-xl font-bold text-gray-800">{selectedSurah.name}</h3>
                             <p className="text-blue-600 font-medium">{selectedReciter.name}</p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [view, setView] = useState('home');
            const [currentSubject, setCurrentSubject] = useState(null);
            const [subjects, setSubjects] = useState([
                { id: 'math', title: 'Mathématiques', color: 'bg-indigo-500', icon: 'calculator' },
                { id: 'fra', title: 'Français', color: 'bg-rose-500', icon: 'book-open' },
                { id: 'isl', title: 'Éducation Islamique', color: 'bg-emerald-500', icon: 'moon' },
                { id: 'hist', title: 'Histoire-Géo', color: 'bg-amber-500', icon: 'globe' },
            ]);
            const [settings, setSettings] = useState({ paperType: 'seyes', penColor: '#1e3a8a', brushSize: 2 });
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [newSub, setNewSub] = useState("");

            const addSubject = () => {
                if(!newSub.trim()) return;
                const colors = ['bg-blue-500', 'bg-purple-500', 'bg-pink-500', 'bg-orange-500', 'bg-teal-500'];
                setSubjects([...subjects, { 
                    id: Date.now(), 
                    title: newSub, 
                    color: colors[Math.floor(Math.random()*colors.length)], 
                    icon: 'book' 
                }]);
                setNewSub("");
                setIsModalOpen(false);
            };

            if (view === 'home') return (
                <div className="flex flex-col h-full bg-neutral-50 overflow-hidden">
                    <div className="max-w-7xl mx-auto w-full p-6 md:p-10 flex-1 overflow-y-auto">
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12 animate-fade-in">
                            <div>
                                <h1 className="text-4xl font-extrabold text-gray-900 tracking-tight">Mes Cahiers</h1>
                                <p className="text-lg text-gray-500 mt-1">Gérez vos notes et cours en toute simplicité</p>
                            </div>
                            <Button onClick={() => setIsModalOpen(true)} size="lg" className="rounded-full shadow-lg shadow-blue-200 w-full md:w-auto gap-2 py-3 px-6">
                                <Icon name="plus" size={24} /> Créer une matière
                            </Button>
                        </header>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 pb-20">
                            {subjects.map((sub, i) => (
                                <div key={sub.id} onClick={() => { setCurrentSubject(sub); setView('notebook'); }} 
                                    className="group bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 cursor-pointer border border-gray-100 flex flex-col h-[300px] animate-slide-up"
                                    style={{animationDelay: `${i*50}ms`}}
                                >
                                    <div className={`h-3 w-full ${sub.color}`}></div>
                                    <div className="p-8 flex-1 flex flex-col items-center justify-center text-center gap-6 relative">
                                        <div className={`absolute w-32 h-32 rounded-full ${sub.color} opacity-5 blur-2xl group-hover:scale-150 transition-transform duration-700`}></div>
                                        <div className={`w-20 h-20 rounded-2xl ${sub.color} text-white flex items-center justify-center shadow-xl shadow-${sub.color}/30 group-hover:rotate-12 transition-transform duration-300`}>
                                            <Icon name={sub.icon} size={40} />
                                        </div>
                                        <h3 className="text-2xl font-bold text-gray-800 line-clamp-2 group-hover:text-blue-600 transition-colors">{sub.title}</h3>
                                    </div>
                                    <div className="border-t p-4 bg-gray-50 flex justify-between items-center text-xs font-bold text-gray-400 uppercase tracking-wider">
                                        <span>Grand Format</span>
                                        <span className="group-hover:translate-x-1 transition-transform text-blue-500">Ouvrir</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Nouvelle matière">
                        <div className="space-y-6">
                            <input autoFocus className="w-full border border-gray-300 p-4 rounded-xl text-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: Mathématiques" value={newSub} onChange={e => setNewSub(e.target.value)} onKeyDown={e => e.key==='Enter' && addSubject()} />
                            <div className="flex justify-end gap-3"><Button variant="ghost" onClick={() => setIsModalOpen(false)}>Annuler</Button><Button onClick={addSubject}>Créer</Button></div>
                        </div>
                    </Modal>
                </div>
            );

            return (
                <NotebookView 
                    subject={currentSubject} 
                    onBack={() => setView('home')} 
                    settings={settings}
                    onUpdateSettings={setSettings}
                />
            );
        };

        const NotebookView = ({ subject, onBack, settings, onUpdateSettings }) => {
            const [tab, setTab] = useState('write');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);

            const TABS = [{id: 'write', icon: 'pen-tool', label: 'Écriture'}, {id: 'history', icon: 'history', label: 'Historique'}, {id: 'quran', icon: 'book-open', label: 'Coran'}];

            return (
                <div className="h-full flex flex-col bg-neutral-100">
                    <header className="bg-white border-b px-4 py-3 flex items-center justify-between shadow-sm z-30">
                        <div className="flex items-center gap-3">
                            <Button variant="ghost" size="icon" onClick={onBack}><Icon name="arrow-left" size={20} /></Button>
                            <div><h2 className="text-lg font-bold text-gray-800">{subject.title}</h2></div>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="hidden md:flex bg-gray-100 p-1 rounded-lg mr-2">
                                {TABS.map(t => (
                                    <button key={t.id} onClick={() => setTab(t.id)} className={`flex items-center gap-2 px-4 py-1.5 rounded-md text-sm font-medium transition-all ${tab === t.id ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>
                                        <Icon name={t.icon} size={16} /> {t.label}
                                    </button>
                                ))}
                            </div>
                            <Button variant="ghost" size="icon" onClick={() => setIsSettingsOpen(true)}><Icon name="settings" size={20} /></Button>
                            <button className="md:hidden p-2" onClick={() => setIsMenuOpen(!isMenuOpen)}><Icon name="menu" size={24} /></button>
                        </div>
                    </header>

                    {isMenuOpen && (
                        <div className="md:hidden absolute top-[60px] left-0 w-full bg-white shadow-xl z-50 p-2 animate-slide-up">
                            {TABS.map(t => (
                                <button key={t.id} onClick={() => { setTab(t.id); setIsMenuOpen(false); }} className={`w-full flex items-center gap-3 p-4 rounded-lg text-sm font-medium mb-1 ${tab === t.id ? 'bg-blue-50 text-blue-600' : 'text-gray-600'}`}>
                                    <Icon name={t.icon} size={20} /> {t.label}
                                </button>
                            ))}
                        </div>
                    )}

                    <main className="flex-1 overflow-hidden relative">
                        {tab === 'write' && (
                            <div className="h-full w-full p-2 md:p-8 overflow-auto flex justify-center bg-neutral-200/50">
                                <div className="w-full max-w-[210mm] h-full min-h-[297mm] bg-white shadow-2xl flex flex-col animate-slide-up">
                                    <div className="h-24 p-8 flex justify-between items-end border-b border-gray-100">
                                        <h3 className="font-hand text-3xl text-blue-600">{subject.title}</h3>
                                        <span className="font-hand text-xl text-gray-400">{new Date().toLocaleDateString()}</span>
                                    </div>
                                    <div className="flex-1 relative">
                                        <NotebookCanvas color={settings.penColor} brushSize={settings.brushSize} paperType={settings.paperType} />
                                    </div>
                                </div>
                            </div>
                        )}
                        {tab === 'history' && (
                            <div className="h-full overflow-y-auto p-6 md:p-10 animate-fade-in">
                                <div className="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6">
                                    <div className="aspect-[210/297] border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center text-gray-400 hover:border-blue-500 hover:text-blue-500 hover:bg-blue-50 transition-all cursor-pointer">
                                        <Icon name="plus" size={32} /><span className="mt-2 font-medium">Nouvelle page</span>
                                    </div>
                                </div>
                            </div>
                        )}
                        {tab === 'quran' && (
                            <div className="h-full w-full bg-gradient-to-br from-blue-50 to-indigo-50 animate-fade-in">
                                <QuranPlayer />
                            </div>
                        )}
                    </main>

                    <Modal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} title="Paramètres">
                        <div className="space-y-6">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-3">Papier</label>
                                <div className="grid grid-cols-2 gap-3">
                                    {[{id:'seyes',l:'Grands Carreaux'},{id:'grid',l:'Petits Carreaux'},{id:'lines',l:'Ligné'},{id:'dots',l:'Pointillés'}].map(t => (
                                        <button key={t.id} onClick={() => onUpdateSettings({...settings, paperType: t.id})} className={`p-3 rounded-lg border text-sm ${settings.paperType === t.id ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : 'hover:bg-gray-50'}`}>{t.l}</button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-3">Couleur</label>
                                <div className="flex gap-3">
                                    {['#1e3a8a','#000000','#ef4444','#10b981'].map(c => (
                                        <button key={c} onClick={() => onUpdateSettings({...settings, penColor: c})} className={`w-10 h-10 rounded-full border-2 ${settings.penColor === c ? 'border-gray-900 scale-110' : 'border-transparent'}`} style={{backgroundColor: c}} />
                                    ))}
                                </div>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
