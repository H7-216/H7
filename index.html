    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: none;
            background: hsl(0 0% 98%);
        }
        
        .bg-seyes {
            background-color: #ffffff;
            background-image: 
                linear-gradient(0deg, #d4d4d4 1px, transparent 1px),
                linear-gradient(0deg, #e5e7eb 1px, transparent 1px),
                linear-gradient(90deg, #fca5a5 1px, transparent 1px),
                linear-gradient(90deg, #d4d4d4 1px, transparent 1px);
            background-size: 100% 32px, 100% 8px, 100% 100%, 32px 100%;
            background-position: 0 0, 0 0, 40px 0, 0 0;
        }
        
        .bg-grid-paper {
            background-color: #ffffff;
            background-image: 
                linear-gradient(#e5e7eb 1px, transparent 1px),
                linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .paper-shadow {
            box-shadow: 
                0 1px 1px hsl(0deg 0% 0% / 0.075),
                0 2px 2px hsl(0deg 0% 0% / 0.075),
                0 4px 4px hsl(0deg 0% 0% / 0.075),
                0 8px 8px hsl(0deg 0% 0% / 0.075),
                0 16px 16px hsl(0deg 0% 0% / 0.075);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: hsl(240 3.8% 46.1% / 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: hsl(240 3.8% 46.1% / 0.5); }
        
        /* Animations */
        .animate-in { animation: animateIn 0.3s ease-out; }
        .zoom-in-95 { animation: zoomIn95 0.3s ease-out; }
        .slide-in { animation: slideIn 0.3s ease-out; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        
        @keyframes animateIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn95 { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Icônes Lucide simulées */
        .icon { display: inline-flex; align-items: center; justify-content: center; }
        
        /* Classes utilitaires */
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .backdrop-blur-md { backdrop-filter: blur(12px); }
        
        /* Effets hover */
        .hover-lift:hover { transform: translateY(-4px); transition: transform 0.2s ease; }
        .hover-scale:hover { transform: scale(1.02); transition: transform 0.2s ease; }
    </style>
</head>

        // ========== FONCTIONS UTILITAIRES ==========
        function cn(...classes) {
            return classes.filter(Boolean).join(' ');
        }
        
        function showToast(title, description = "", type = "info") {
            const toastId = 'toast-' + Date.now();
            const toastContainer = document.getElementById('toast-container');
            
            const toast = document.createElement('div');
            toast.id = toastId;
            toast.className = cn(
                "bg-white border border-gray-200 shadow-lg rounded-lg p-4 w-80 animate-in slide-in",
                type === "success" ? "border-l-4 border-l-green-500" : "",
                type === "error" ? "border-l-4 border-l-red-500" : "",
                type === "warning" ? "border-l-4 border-l-yellow-500" : ""
            );
            
            toast.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <h4 class="font-semibold text-sm text-gray-900">${title}</h4>
                        ${description ? `<p class="text-sm text-gray-600 mt-1">${description}</p>` : ''}
                    </div>
                    <button onclick="document.getElementById('${toastId}').remove()" 
                            class="text-gray-400 hover:text-gray-600 ml-4">
                        ✕
                    </button>
                </div>
            `;
            
            toastContainer.appendChild(toast);
            
            // Supprimer après 3 secondes
            setTimeout(() => {
                const toastEl = document.getElementById(toastId);
                if (toastEl) {
                    toastEl.style.opacity = '0';
                    toastEl.style.transform = 'translateY(10px)';
                    setTimeout(() => toastEl.remove(), 300);
                }
            }, 3000);
        }
        
        function formatDate(date) {
            return new Date(date).toLocaleDateString('fr-FR', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // ========== COMPOSANTS UI ==========
        function createButton({ 
            text = "", 
            onClick = () => {}, 
            className = "", 
            variant = "default",
            size = "default",
            icon = null,
            disabled = false
        }) {
            const button = document.createElement('button');
            
            const baseClasses = "inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50";
            
            const variants = {
                default: "bg-primary text-primary-foreground hover:bg-primary/90",
                destructive: "bg-red-600 text-white hover:bg-red-700",
                outline: "border border-input bg-background hover:bg-accent hover:text-accent-foreground",
                secondary: "bg-secondary text-secondary-foreground hover:bg-secondary/80",
                ghost: "hover:bg-accent hover:text-accent-foreground",
                link: "text-primary underline-offset-4 hover:underline",
            };
            
            const sizes = {
                default: "h-10 px-4 py-2",
                sm: "h-9 rounded-md px-3",
                lg: "h-11 rounded-md px-8",
                icon: "h-10 w-10",
            };
            
            button.className = cn(
                baseClasses,
                variants[variant],
                sizes[size],
                className
            );
            
            button.onclick = onClick;
            button.disabled = disabled;
            
            if (icon) {
                const iconSpan = document.createElement('span');
                iconSpan.className = "mr-2";
                iconSpan.textContent = icon;
                button.appendChild(iconSpan);
            }
            
            if (text) {
                button.appendChild(document.createTextNode(text));
            }
            
            return button;
        }
        
        function createInput({ 
            placeholder = "", 
            value = "", 
            onChange = () => {},
            className = "",
            type = "text"
        }) {
            const input = document.createElement('input');
            input.type = type;
            input.placeholder = placeholder;
            input.value = value;
            input.className = cn(
                "flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50",
                className
            );
            
            input.oninput = (e) => onChange(e.target.value);
            return input;
        }
        
        function createCard({ children, className = "" }) {
            const card = document.createElement('div');
            card.className = cn("rounded-lg border bg-card text-card-foreground shadow-sm", className);
            
            if (typeof children === 'string') {
                card.innerHTML = children;
            } else if (Array.isArray(children)) {
                children.forEach(child => {
                    if (child instanceof Node) {
                        card.appendChild(child);
                    } else {
                        card.appendChild(document.createTextNode(child));
                    }
                });
            } else if (children instanceof Node) {
                card.appendChild(children);
            }
            
            return card;
        }
        
        function createBadge({ text, className = "", variant = "default" }) {
            const badge = document.createElement('div');
            badge.className = cn(
                "inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors",
                variant === "default" ? "bg-primary text-primary-foreground hover:bg-primary/80 border-transparent" : "",
                variant === "secondary" ? "bg-secondary text-secondary-foreground hover:bg-secondary/80" : "",
                variant === "outline" ? "text-foreground" : "",
                className
            );
            badge.textContent = text;
            return badge;
        }

        // ========== FONCTIONS CANVAS AVANCÉES ==========
        function initAdvancedCanvas() {
            const canvas = document.getElementById('mainCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            
            // Restaurer l'état précédent si existant
            if (appData.canvasState) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                };
                img.src = appData.canvasState;
            }
            
            function startDrawing(e) {
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                lastX = e.clientX - rect.left;
                lastY = e.clientY - rect.top;
            }
            
            function draw(e) {
                if (!isDrawing) return;
                
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                
                // Appliquer les paramètres actuels
                if (appData.currentTool === 'eraser') {
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = appData.strokeWidth * 2;
                } else {
                    ctx.strokeStyle = appData.currentColor;
                    ctx.globalCompositeOperation = 'source-over';
                    if (appData.currentTool === 'highlighter') {
                        ctx.globalAlpha = 0.4;
                        ctx.lineWidth = appData.strokeWidth * 3;
                    } else {
                        ctx.globalAlpha = 1;
                        ctx.lineWidth = appData.strokeWidth;
                    }
                }
                
                ctx.stroke();
                
                lastX = x;
                lastY = y;
            }
            
            function stopDrawing() {
                isDrawing = false;
                // Sauvegarder l'état
                appData.canvasState = canvas.toDataURL();
            }
            
            // Événements souris
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            
            // Événements tactiles
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (e.touches.length === 1) {
                    const touch = e.touches[0];
                    const rect = canvas.getBoundingClientRect();
                    lastX = touch.clientX - rect.left;
                    lastY = touch.clientY - rect.top;
                    isDrawing = true;
                }
            });
            
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (isDrawing && e.touches.length === 1) {
                    const touch = e.touches[0];
                    const rect = canvas.getBoundingClientRect();
                    const x = touch.clientX - rect.left;
                    const y = touch.clientY - rect.top;
                    
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    
                    if (appData.currentTool === 'eraser') {
                        ctx.strokeStyle = '#FFFFFF';
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.lineWidth = appData.strokeWidth * 2;
                    } else {
                        ctx.strokeStyle = appData.currentColor;
                        ctx.globalCompositeOperation = 'source-over';
                        if (appData.currentTool === 'highlighter') {
                            ctx.globalAlpha = 0.4;
                            ctx.lineWidth = appData.strokeWidth * 3;
                        } else {
                            ctx.globalAlpha = 1;
                            ctx.lineWidth = appData.strokeWidth;
                        }
                    }
                    
                    ctx.stroke();
                    
                    lastX = x;
                    lastY = y;
                }
            });
            
            canvas.addEventListener('touchend', stopDrawing);
            canvas.addEventListener('touchcancel', stopDrawing);
        }
        
        // ========== FONCTIONS DE L'APPLICATION ==========
        function changePage(page) {
            appData.currentPage = page;
            renderApp();
            
            // Ajouter une animation
            const app = document.getElementById('app');
            app.classList.add('animate-in');
            setTimeout(() => app.classList.remove('animate-in'), 300);
        }
        
        function setTool(toolId) {
            appData.currentTool = toolId;
            const tool = appData.tools.find(t => t.id === toolId);
            if (tool) {
                appData.strokeWidth = tool.defaultWidth;
            }
            
            if (appData.currentPage === 'editor') {
                renderApp();
            }
        }
        
        function setColor(color) {
            appData.currentColor = color;
            if (appData.currentTool === 'eraser') {
                appData.currentTool = 'pen';
            }
            
            // Fermer le color picker
            const picker = document.getElementById('colorPicker');
            if (picker) {
                picker.classList.add('hidden');
            }
            
            if (appData.currentPage === 'editor') {
                renderApp();
            }
        }
        
        function setStrokeWidth(width) {
            appData.strokeWidth = parseInt(width);
            
            if (appData.currentPage === 'editor') {
                renderApp();
            }
        }
        
        function toggleColorPicker() {
            const picker = document.getElementById('colorPicker');
            if (picker) {
                picker.classList.toggle('hidden');
            }
        }
        
        function openNotebook(id) {
            appData.activeNotebookId = id;
            changePage('editor');
            showToast('Cahier ouvert', 'Vous pouvez maintenant prendre des notes', 'success');
        }
        
        function createNewNotebook() {
            const newId = (appData.notebooks.length + 1).toString();
            const subjects = ['Physique', 'Chimie', 'Maths', 'Français', 'Histoire', 'SVT'];
            const colors = ['#E0F2FE', '#DCFCE7', '#FAE8FF', '#FEF3C7', '#FCE7F3', '#E0E7FF'];
            
            const newNotebook = {
                id: newId,
                title: "Nouveau Cahier",
                subject: subjects[Math.floor(Math.random() * subjects.length)],
                color: colors[Math.floor(Math.random() * colors.length)],
                lastModified: "À l'instant",
                pageCount: 1,
                tags: ["Nouveau"],
                shared: false
            };
            
            appData.notebooks.unshift(newNotebook);
            openNotebook(newId);
        }
        
        function saveCanvas() {
            const canvas = document.getElementById('mainCanvas');
            if (canvas) {
                appData.canvasState = canvas.toDataURL();
                showToast('Sauvegarde réussie', 'Vos modifications ont été enregistrées', 'success');
                
                // Simuler un enregistrement dans l'historique
                const newHistoryItem = {
                    id: appData.historyItems.length + 1,
                    title: "Devoir de Physique - Chapitre 4",
                    subject: "Physique",
                    date: "À l'instant",
                    preview: "Dernière modification sauvegardée"
                };
                appData.historyItems.unshift(newHistoryItem);
            }
        }
        
        function handleFileImport() {
            showToast('Importation', 'Sélectionnez un fichier à importer', 'info');
            // Simuler un input file
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.pdf,.jpg,.png,.doc,.txt';
            input.onchange = (e) => {
                if (e.target.files[0]) {
                    showToast('Fichier importé', `${e.target.files[0].name} a été importé avec succès`, 'success');
                    
                    // Créer un nouveau cahier pour le fichier
                    createNewNotebook();
                }
            };
            input.click();
        }
        
        function playSurah(number) {
            const surah = appData.surahs.find(s => s.number === number);
            if (surah) {
                showToast(`Sourate ${surah.name}`, `Lecture de ${surah.englishName} démarrée`, 'info');
            }
        }
        
        function openHistoryItem(id) {
            showToast('Ouverture', 'Chargement de la version historique...', 'info');
            setTimeout(() => {
                changePage('editor');
            }, 500);
        }
        
        // ========== RENDU PRINCIPAL ==========
        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            
            const page = renderPageByType();
            app.appendChild(page);
        }
        
        // ========== INITIALISATION ==========
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            
            // Ajouter des styles de police
            const style = document.createElement('style');
            style.textContent = `
                @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
                body { font-family: 'Inter', sans-serif; }
            `;
            document.head.appendChild(style);
            
            // Exposer les fonctions globalement
            window.changePage = changePage;
            window.setTool = setTool;
            window.setColor = setColor;
            window.setStrokeWidth = setStrokeWidth;
            window.toggleColorPicker = toggleColorPicker;
            window.openNotebook = openNotebook;
            window.createNewNotebook = createNewNotebook;
            window.saveCanvas = saveCanvas;
            window.handleFileImport = handleFileImport;
            window.playSurah = playSurah;
            window.openHistoryItem = openHistoryItem;
            
            console.log('SmartNotes chargé avec succès ! 🚀');
        });
        
    </script>
</body>
</html>
