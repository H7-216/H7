    function Canvas({ tool, color, width, backgroundType }) {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const lastPoint = useRef(null);
      const bgClass = { seyes: "bg-seyes", grid: "bg-grid-paper", blank: "bg-white" }[backgroundType];

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        const ctx = canvas.getContext("2d");
        if (ctx) {
          ctx.scale(dpr, dpr);
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
        }
        const handleResize = () => {
          if (!canvas) return;
          const rect = canvas.getBoundingClientRect();
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          if (ctx) ctx.scale(dpr, dpr);

        window.addEventListener("resize", handleResize);

      const getPoint = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0, pressure: 0.5 };

        return { x: e.clientX - rect.left, y: e.clientY - rect.top, pressure: e.pressure || 0.5 };

      const startDrawing = (e) => {
        e.currentTarget.setPointerCapture(e.pointerId);
        setIsDrawing(true);
        lastPoint.current = getPoint(e);
      };

      const draw = (e) => {
        if (!isDrawing || !lastPoint.current || !canvasRef.current) return;
        const ctx = canvasRef.current.getContext("2d");
        const currentPoint = getPoint(e);
        ctx.beginPath();
        ctx.moveTo(lastPoint.current.x, lastPoint.current.y);
        ctx.lineTo(currentPoint.x, currentPoint.y);

            ctx.lineWidth = width * 3;

          }

        lastPoint.current = currentPoint;

        e.currentTarget.releasePointerCapture(e.pointerId);
        setIsDrawing(false);

      };

        React.createElement("canvas", {
          ref: canvasRef,
          className: "w-full h-full touch-none cursor-crosshair",
          onPointerDown: startDrawing,
          onPointerMove: draw,
          onPointerUp: stopDrawing,
          onPointerLeave: stopDrawing,

             React.createElement(Button, { variant: activeTool === "eraser" ? "secondary" : "ghost", size: "sm", onClick: () => setActiveTool("eraser"), className: activeTool === "eraser" ? "shadow-sm bg-white text-primary" : "text-muted-foreground" }, React.createElement(LucideIcons.Eraser, { className: "w-4 h-4 mr-2" }), "Gomme")
           ),

             React.createElement("div", { className: "w-4 h-4 rounded-full border border-border", style: { backgroundColor: activeTool === 'eraser' ? '#ffffff' : activeColor } }),
             React.createElement("span", { className: "hidden sm:inline" }, "Couleur & Taille")

      const MOCK_NOTEBOOKS = [
