<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Cahier Numérique - Version Portable</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400..700&family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif'],
                        hand: ['Caveat', 'cursive'],
                        arabic: ['Amiri', 'serif'],
                    },
                    colors: {
                        primary: '#2563eb', // blue-600
                        secondary: '#f3f4f6', // gray-100
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Paper -->
    <style>
        .seyes-detailed {
            background-color: #fff;
            background-image: 
                linear-gradient(90deg, rgba(200, 200, 255, 0.5) 1px, transparent 1px),
                linear-gradient(rgba(200, 200, 255, 0.8) 1px, transparent 1px),
                linear-gradient(rgba(200, 200, 255, 0.3) 1px, transparent 1px);
            background-size: 2rem 100%, 100% 2rem, 100% 0.5rem;
            position: relative;
        }
        .seyes-detailed::before {
            content: '';
            position: absolute;
            left: 3rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ff9999;
            z-index: 5;
        }
        .notebook-shadow {
            box-shadow: 0 1px 1px rgba(0,0,0,0.15), 0 10px 0 -5px #eee, 0 10px 1px -4px rgba(0,0,0,0.15), 0 20px 0 -10px #eee, 0 20px 1px -9px rgba(0,0,0,0.15);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <!-- Lucide Icons (Script version) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-neutral-100 text-neutral-900 h-screen overflow-hidden selection:bg-blue-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS COMPONENT WRAPPERS (Simulating Lucide React) ---
        // We use the 'data-lucide' attribute and calling lucide.createIcons() after render
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- COMPONENTS ---

        // 1. UI Components (Simplified)
        const Button = ({ children, onClick, className = "", variant = "primary", size = "md", disabled = false }) => {
            const baseStyle = "inline-flex items-center justify-center rounded-md font-medium transition-colors focus:outline-none disabled:opacity-50 disabled:pointer-events-none";
            const variants = {
                primary: "bg-blue-600 text-white hover:bg-blue-700 shadow-sm",
                outline: "border border-neutral-200 bg-white hover:bg-neutral-100 text-neutral-900",
                ghost: "hover:bg-neutral-100 text-neutral-600",
                icon: "p-0 rounded-full"
            };
            const sizes = {
                sm: "h-8 px-3 text-xs",
                md: "h-10 px-4 py-2",
                lg: "h-12 px-8 text-lg",
                icon: "h-10 w-10"
            };
            
            return (
                <button 
                    onClick={onClick} 
                    disabled={disabled}
                    className={`${baseStyle} ${variants[variant] || variants.primary} ${sizes[size] || sizes.md} ${className}`}
                >
                    {children}
                </button>
            );
        };

        // 2. Notebook Canvas (Drawing)
        const NotebookCanvas = ({ color = "#1e3a8a", brushSize = 2 }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [ctx, setCtx] = useState(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                // Handle High DPI
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;

                const context = canvas.getContext('2d');
                context.scale(dpr, dpr);
                context.lineCap = 'round';
                context.lineJoin = 'round';
                context.strokeStyle = color;
                context.lineWidth = brushSize;
                setCtx(context);
            }, []);

            useEffect(() => {
                if (ctx) {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = brushSize;
                }
            }, [color, brushSize, ctx]);

            const getPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                if (e.touches) {
                    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
                }
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };

            const start = (e) => {
                setIsDrawing(true);
                const { x, y } = getPos(e);
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const move = (e) => {
                if (!isDrawing) return;
                const { x, y } = getPos(e);
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stop = () => {
                setIsDrawing(false);
                ctx.closePath();
            };
            
            const clear = () => {
                if(ctx && canvasRef.current) {
                    ctx.clearRect(0,0, canvasRef.current.width, canvasRef.current.height);
                }
            }

            return (
                <div className="relative w-full h-full">
                     <div className="absolute top-4 right-4 z-10">
                        <Button variant="ghost" size="icon" onClick={clear} title="Effacer">
                            <Icon name="trash-2" size={16} />
                        </Button>
                    </div>
                    <canvas 
                        ref={canvasRef}
                        className="w-full h-full touch-none cursor-crosshair"
                        onMouseDown={start} onMouseMove={move} onMouseUp={stop} onMouseLeave={stop}
                        onTouchStart={start} onTouchMove={move} onTouchEnd={stop}
                    />
                </div>
            );
        };

        // 3. Quran Player (API Integration)
        const QuranPlayer = () => {
            const [surahs, setSurahs] = useState([]);
            const [reciters, setReciters] = useState([]);
            const [selectedSurah, setSelectedSurah] = useState("1");
            const [selectedReciter, setSelectedReciter] = useState("7"); // Mishary
            const [isPlaying, setIsPlaying] = useState(false);
            const [loading, setLoading] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                const init = async () => {
                    try {
                        const s = await axios.get('https://api.quran.com/api/v4/chapters');
                        setSurahs(s.data.chapters);
                        const r = await axios.get('https://api.quran.com/api/v4/resources/recitations');
                        setReciters(r.data.recitations);
                    } catch(e) { console.error(e); }
                };
                init();
            }, []);

            useEffect(() => {
                const loadAudio = async () => {
                    if (!audioRef.current) return;
                    setLoading(true);
                    setIsPlaying(false);
                    audioRef.current.pause();
                    try {
                        const res = await axios.get(`https://api.quran.com/api/v4/chapter_recitations/${selectedReciter}/${selectedSurah}`);
                        if(res.data.audio_file.audio_url) {
                            audioRef.current.src = res.data.audio_file.audio_url;
                        }
                    } catch(e) { console.error(e); }
                    finally { setLoading(false); }
                };
                loadAudio();
            }, [selectedSurah, selectedReciter]);

            const toggle = () => {
                if(!audioRef.current) return;
                if(isPlaying) audioRef.current.pause();
                else audioRef.current.play();
                setIsPlaying(!isPlaying);
            };

            return (
                <div className="h-full flex flex-col gap-4 p-4">
                    <audio ref={audioRef} onEnded={() => setIsPlaying(false)} />
                    
                    <div className="bg-white/80 backdrop-blur rounded-xl p-6 shadow-sm border border-white/50 space-y-6">
                        <h2 className="text-2xl font-arabic text-center text-blue-600">القرآن الكريم</h2>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="space-y-2">
                                <label className="text-sm font-medium text-gray-500">Récitateur</label>
                                <select 
                                    className="w-full p-2 rounded-md border border-gray-200 bg-white"
                                    value={selectedReciter}
                                    onChange={(e) => setSelectedReciter(e.target.value)}
                                >
                                    {reciters.map(r => (
                                        <option key={r.id} value={r.id}>{r.reciter_name}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="space-y-2">
                                <label className="text-sm font-medium text-gray-500">Sourate</label>
                                <select 
                                    className="w-full p-2 rounded-md border border-gray-200 bg-white font-arabic text-right"
                                    value={selectedSurah}
                                    onChange={(e) => setSelectedSurah(e.target.value)}
                                >
                                    {surahs.map(s => (
                                        <option key={s.id} value={s.id}>{s.name_arabic} - {s.name_simple}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div className="flex justify-center items-center gap-4 pt-2">
                            <Button variant="outline" size="icon" onClick={() => setSelectedSurah(String(Math.max(1, parseInt(selectedSurah)-1)))}>
                                <Icon name="skip-back" size={16} />
                            </Button>
                            
                            <Button 
                                className="h-16 w-16 rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-lg hover:scale-105 transition-transform" 
                                onClick={toggle}
                                disabled={loading}
                            >
                                {loading ? <span className="animate-spin">⌛</span> : 
                                 isPlaying ? <Icon name="pause" size={32} /> : <Icon name="play" size={32} className="ml-1" />}
                            </Button>

                            <Button variant="outline" size="icon" onClick={() => setSelectedSurah(String(Math.min(114, parseInt(selectedSurah)+1)))}>
                                <Icon name="skip-forward" size={16} />
                            </Button>
                        </div>
                    </div>

                    <div className="flex-1 bg-white/60 rounded-xl p-8 text-center border border-white/50 shadow-inner overflow-y-auto">
                        <p className="font-arabic text-3xl leading-loose opacity-80">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
                        <p className="mt-4 text-sm text-gray-500 font-sans">
                            {surahs.find(s => s.id == selectedSurah)?.name_simple}
                        </p>
                    </div>
                </div>
            );
        };

        // 4. Main App Pages
        const Home = ({ onNavigate }) => {
            const [subjects, setSubjects] = useState([
                { id: 'math', title: 'Mathématiques', color: 'bg-blue-600' },
                { id: 'fra', title: 'Français', color: 'bg-rose-600' },
                { id: 'isl', title: 'Éducation Islamique', color: 'bg-teal-600' },
            ]);
            const [newSub, setNewSub] = useState("");
            const [showDialog, setShowDialog] = useState(false);

            const add = () => {
                if(!newSub) return;
                setSubjects([...subjects, { id: Date.now(), title: newSub, color: 'bg-slate-600' }]);
                setNewSub("");
                setShowDialog(false);
            };

            return (
                <div className="max-w-6xl mx-auto p-8 space-y-8">
                    <header className="flex justify-between items-center">
                        <div>
                            <h1 className="text-4xl font-bold text-neutral-900">Mes Cahiers</h1>
                            <p className="text-neutral-500">Sélectionnez une matière</p>
                        </div>
                        <Button onClick={() => setShowDialog(true)} className="rounded-full gap-2 px-6">
                            <Icon name="plus" size={20} /> Nouveau
                        </Button>
                    </header>

                    {/* Dialog Modal */}
                    {showDialog && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl animate-in fade-in zoom-in-95">
                                <h3 className="text-lg font-bold mb-4">Nouvelle matière</h3>
                                <input 
                                    autoFocus
                                    className="w-full border p-2 rounded mb-4" 
                                    placeholder="Ex: Physique"
                                    value={newSub}
                                    onChange={e => setNewSub(e.target.value)}
                                />
                                <div className="flex justify-end gap-2">
                                    <Button variant="ghost" onClick={() => setShowDialog(false)}>Annuler</Button>
                                    <Button onClick={add}>Créer</Button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        {subjects.map(sub => (
                            <div 
                                key={sub.id} 
                                onClick={() => onNavigate('notebook', sub)}
                                className="group cursor-pointer bg-white h-[320px] relative rounded-lg overflow-hidden shadow-sm hover:shadow-xl transition-all hover:-translate-y-1"
                            >
                                <div className={`absolute left-0 top-0 bottom-0 w-4 ${sub.color} z-20 shadow-inner`}></div>
                                <div className="absolute left-4 top-0 bottom-0 w-[1px] bg-black/5 z-20"></div>
                                
                                <div className="pt-12 pb-4 pl-10 pr-4">
                                    <div className="bg-white border-2 border-dashed border-neutral-300 p-4 rounded-lg transform -rotate-1 group-hover:rotate-0 transition-transform">
                                        <h3 className="text-2xl font-hand text-center line-clamp-2">{sub.title}</h3>
                                    </div>
                                </div>
                                <div className="absolute bottom-0 left-0 right-0 h-12 border-t flex items-center justify-between px-4 pl-10 text-xs text-gray-400 bg-gray-50">
                                    <span className="flex items-center gap-1"><Icon name="book" size={12}/> A4</span>
                                    <span>Grand Format</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Notebook = ({ subject, onBack }) => {
            const [tab, setTab] = useState('write'); // write, history, quran

            return (
                <div className="h-screen flex flex-col bg-neutral-100">
                    <header className="bg-white border-b px-6 py-3 flex items-center justify-between shadow-sm z-20">
                        <div className="flex items-center gap-4">
                            <Button variant="ghost" size="icon" onClick={onBack}>
                                <Icon name="arrow-left" size={20} />
                            </Button>
                            <div>
                                <h1 className="text-xl font-bold">{subject.title}</h1>
                                <p className="text-xs text-gray-400 flex items-center gap-1">
                                    <Icon name="calendar" size={12}/> {new Date().toLocaleDateString('fr-FR')}
                                </p>
                            </div>
                        </div>
                        <Button variant="outline" size="sm" className="gap-2">
                            <Icon name="save" size={16} /> Sauvegarder
                        </Button>
                    </header>

                    {/* Tabs */}
                    <div className="bg-white/50 backdrop-blur border-b px-6 flex gap-6">
                        {[
                            {id: 'write', icon: 'pen-tool', label: 'Écrire'},
                            {id: 'history', icon: 'history', label: 'Historique'},
                            {id: 'quran', icon: 'book-open', label: 'Coran'}
                        ].map(t => (
                            <button 
                                key={t.id}
                                onClick={() => setTab(t.id)}
                                className={`flex items-center gap-2 py-3 px-2 border-b-2 transition-colors ${tab === t.id ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-800'}`}
                            >
                                <Icon name={t.icon} size={16} /> {t.label}
                            </button>
                        ))}
                    </div>

                    <div className="flex-1 relative overflow-hidden p-4 md:p-8">
                        {tab === 'write' && (
                            <div className="max-w-[210mm] mx-auto h-full bg-white shadow-2xl rounded-sm overflow-hidden seyes-detailed relative animate-in fade-in zoom-in-95">
                                <div className="absolute top-0 left-16 right-0 h-24 p-6 z-10 pointer-events-none">
                                    <div className="border-b-2 border-neutral-800/20 pb-2 flex justify-between items-end">
                                        <span className="font-hand text-2xl text-blue-800 opacity-80">{subject.title}</span>
                                        <span className="font-hand text-xl text-neutral-500">{new Date().toLocaleDateString()}</span>
                                    </div>
                                </div>
                                <div className="h-full pt-24 pl-12">
                                    <NotebookCanvas />
                                </div>
                            </div>
                        )}

                        {tab === 'history' && (
                            <div className="max-w-5xl mx-auto grid grid-cols-4 gap-6 animate-in slide-in-from-bottom-4">
                                <div className="aspect-[210/297] border-2 border-dashed border-gray-300 rounded-lg flex flex-col items-center justify-center text-gray-400 hover:border-gray-500 hover:text-gray-600 cursor-pointer bg-white/50">
                                    <Icon name="plus" size={32} />
                                    <span className="mt-2 text-sm">Nouvelle page</span>
                                </div>
                                <div className="aspect-[210/297] bg-white shadow-md seyes-detailed p-4 rounded-sm flex flex-col items-center justify-center opacity-80 hover:scale-105 transition-transform cursor-pointer">
                                    <Icon name="file-text" size={40} className="text-blue-900 opacity-20" />
                                    <span className="mt-4 text-xs font-mono text-gray-400">Page 1</span>
                                </div>
                            </div>
                        )}

                        {tab === 'quran' && (
                            <div className="max-w-4xl mx-auto h-full animate-in slide-in-from-right-4">
                                <QuranPlayer />
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 5. App Root
        const App = () => {
            const [view, setView] = useState('home'); // home, notebook
            const [currentSubject, setCurrentSubject] = useState(null);

            const navigate = (to, data) => {
                if (to === 'notebook') setCurrentSubject(data);
                setView(to);
            };

            return (
                <div className="h-full">
                    {view === 'home' ? (
                        <Home onNavigate={navigate} />
                    ) : (
                        <Notebook subject={currentSubject} onBack={() => setView('home')} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
